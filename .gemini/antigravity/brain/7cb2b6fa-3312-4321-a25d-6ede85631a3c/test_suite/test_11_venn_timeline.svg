<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 520 720" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="background:#f8fafc;border-radius:14px;box-shadow:inset 0 0 0 1px #e2e8f0;max-width:100%;display:block;">
  
  <defs>
    <filter id="soft-card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.03" />
    </filter>
    <filter id="pill-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A85F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A85F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sparkline-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="estimate-stripes" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d97706" stroke-width="2.5" />
    </pattern>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrowhead-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 8.5 1.5 L 0 5 L 8.5 8.5 z" fill="#475569" />
    </marker>
  </defs>
  <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#cbd5e1" />
  </pattern>
  <rect x="40" y="40" width="520" height="720" fill="url(#dot-grid)" opacity="0.65" />
  <g >
          <rect x="100" y="100" width="400" height="600" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
          <text x="300" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Graphic Design Concept</text>
          <line x1="300" y1="180" x2="300" y2="620" stroke="#e2e8f0" stroke-width="2" />
              <path d="M 300 180 L 260 180 L 180 160" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
              <text x="172" y="164" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#475569">Typography</text>
            
            <circle cx="275" cy="180" r="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
            <circle cx="325" cy="180" r="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" opacity="0.9" />
            <text x="260" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Form</text>
            <text x="340" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Function</text>
          
            <text x="300" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Idea</text>
          
          <text x="300" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#475569">Brainstorming</text>
          <text x="140" y="186" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#e2e8f0">01</text>
          <line x1="140" y1="196" x2="460" y2="196" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1" />
        
              <path d="M 300 400 L 340 400 L 420 380" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
              <text x="428" y="384" text-anchor="start" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#475569">Color</text>
            
            <circle cx="300" cy="400" r="40" fill="#4A85F6" stroke="#0f172a" stroke-width="2" />
            <text x="300" y="404" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Draft</text>
          
          <text x="300" y="460" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#475569">Initial Sketches</text>
          <text x="140" y="406" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#e2e8f0">02</text>
          <line x1="140" y1="416" x2="460" y2="416" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1" />
        
            <circle cx="300" cy="620" r="40" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
            <text x="300" y="624" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Final</text>
          
          <text x="300" y="680" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#475569">Delivery</text>
          <text x="140" y="626" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#e2e8f0">03</text>
          <line x1="140" y1="636" x2="460" y2="636" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1" />
        
        </g>
</svg>